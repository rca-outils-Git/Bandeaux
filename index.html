<!DOCTYPE html>
  <html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"
    >
    <title>Bandeau Carrousel avec Texte, GIF optionnel et Bouton</title>
     <!-- Chargement de Tailwind CSS pour la mise en page responsive et épurée -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons pour des icônes élégantes -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style2.css">
    <script src="script2.js"></script>
  </head> 
  <body class="bg-gray-300">
    <!-- Conteneur principal du Carrousel -->
    <div id="carousel-container">
            
      <!-- Barre de progression -->
      <div class="absolute top-0 left-0 right-0 h-1 bg-slate-800/50">
        <div id="progress" class="progress-bar h-full bg-gradient-to-r from-indigo-500 to-violet-500 w-0"></div>
      </div>
      
      <!-- Zone de contenu des textes (Diapositives) -->
      <div class="min-h-[40px] sm:min-h-[40px] flex items-center justify-center text-center px-2 my-1">
      

    
        <!-- Annonce -->
        <div class="carousel-slide active w-full bg-indigo-950/40 py-6" data-index="0">
          
            <blockquote class="text-lg sm:text-xl md:text-2xl font-medium text-black leading-relaxed max-w-xl">
              <a href="https://sites.google.com/rando-ca.fr/randomania-2026/accueil" target="_blank" class="hover:underline text-blue-400">randomania</a>
              </blockquote>
             
        </div>  
          
        <!-- Annonce -->
        <div class="carousel-slide w-full bg-purple-950/40 py-6" data-index="1">
          
            <blockquote class="text-lg sm:text-xl md:text-2xl font-medium text-black leading-relaxed max-w-xl">
              <a href="https://www.randocotedamour.fr/page/3983060-benevolat-rca" target="_blank" class="hover:underline text-blue-400">missions en cours rejoignez nos bénévoles</a>
              </blockquote>
             
        </div>  
          
        <!-- Annonce -->
        <div class="carousel-slide w-full bg-emerald-950/40 py-6" data-index="2">
          
            <blockquote class="text-lg sm:text-xl md:text-2xl font-medium text-black leading-relaxed max-w-xl">
              <a href="https://www.randocotedamour.fr/collect/choice/561323-q-randomania-2026" target="_blank" class="hover:underline text-blue-400">Troisième texte </a>
              </blockquote>
             
        </div>  
        
      </div>
      <!-- Navigation et Puces -->
      <div class="bg-green flex items-center justify-between pt-1 border-t border-slate-800/80 mt-1">
        
        <!-- Bouton Précédent -->
        <button id="prev-btn" aria-label="Diapositive précédente" class="p-1 rounded-xl bg-slate-800/50 hover:bg-slate-700/60 text-slate-300 hover:text-white transition-all duration-200 border border-slate-700/50 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 active:scale-95">
            <i data-lucide="chevron-left" class="w-3 h-3"></i>
        </button>

        <!-- Indicateurs / Points (Dots) -->
        <div class="flex items-center space-x-2.5" id="dots-container">
            <button class="dot w-8 h-2 rounded-full bg-indigo-500 transition-all duration-300" aria-label="Aller au texte 1" data-index="0"></button>
            <button class="dot w-2 h-2 rounded-full bg-slate-700 hover:bg-slate-500 transition-all duration-300" aria-label="Aller au texte 2" data-index="1"></button>
            <button class="dot w-2 h-2 rounded-full bg-slate-700 hover:bg-slate-500 transition-all duration-300" aria-label="Aller au texte 3" data-index="2"></button>
        </div>

        <!-- Bouton Suivant -->
        <button id="next-btn" aria-label="Diapositive suivante" class="p-1 rounded-xl bg-slate-800/50 hover:bg-slate-700/60 text-slate-300 hover:text-white transition-all duration-200 border border-slate-700/50 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 active:scale-95">
            <i data-lucide="chevron-right" class="w-3 h-3"></i>
        </button>

      </div>

    </div>
  </main>  
  </body>

</html>
