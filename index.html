<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bandeau Carrousel avec Bouton GIF</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
    }

    /* Structure du bandeau (~2 cm de hauteur = 76px) */
    .banner-container {
      display: flex;
      align-items: center;
      height: 76px;
      width: 100%;
      background-color: #ffffff;
      box-sizing: border-box;
      padding: 8px 16px;
      gap: 16px;
    }

    /* Conteneur du carrousel de textes */
    .carousel-wrapper {
      flex: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
    }

    /* Diapositives */
    .carousel-slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      color: #ffffff;
      font-weight: bold;
      font-size: 15px;
      text-align: center;
      text-decoration: none;
      opacity: 0;
      pointer-events: none; /* Désactive le clic sur les diapos masquées */
      transition: opacity 0.5s ease-in-out;
      z-index: 1;
      box-sizing: border-box;
    }

    /* Style quand la diapositive est active */
    .carousel-slide.active {
      opacity: 1;
      pointer-events: auto; /* Réactive le clic uniquement sur la diapositive visible */
      z-index: 2;
    }

    /* Style spécifique si la slide contient un lien valide */
    .carousel-slide.is-clickable {
      cursor: pointer !important;
    }

    .carousel-slide.is-clickable:hover {
      opacity: 0.9;
      text-decoration: underline; /* Indique clairement que le texte est cliquable */
    }

    /* Conteneur et style du bouton GIF */
    .btn-gif-link {
      display: inline-block;
      height: 100%;
      cursor: pointer;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.2s ease;
      z-index: 3;
    }

    .btn-gif-link:hover {
      transform: scale(1.04);
    }

    .btn-gif-link img {
      display: block;
      height: 100%;
      width: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="banner-container">
    <p>Lien 5</p>
    <!-- Zone Carrousel -->
    <div class="carousel-wrapper" id="carousel">
      <!-- Les diapositives seront injectées par le script -->
    </div>

    <!-- Zone Bouton GIF (remplie dynamiquement via l'API) -->
    <a id="gif-button-link" href="#" class="btn-gif-link" target="_top" style="display: none;">
      <img id="gif-button-img" src="" alt="Bouton d'action">
    </a>
  </div>

  <script>
    let currentIndex = 0;
    let slidesElements = [];

    // Fonction utilitaire pour nettoyer et formater les URLs
    function formatUrl(url) {
      if (!url || typeof url !== 'string') return '';
      let cleanUrl = url.trim();
      if (!cleanUrl) return '';
      if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://')) {
        cleanUrl = 'https://' + cleanUrl;
      }
      return cleanUrl;
    }

    // Chargement dynamique depuis Google Apps Script
    fetch("https://script.google.com/macros/s/AKfycbxmbY5WIgEJ9JJ-woQgfR5oF7j79eCSys_Wl-cxDmpaHt-ay1HPtPRnQRK0-aXbqHzK/exec")
      .then(response => {
        if (!response.ok) {
          throw new Error('Impossible de récupérer la configuration');
        }
        return response.json();
      })
      .then(data => {
        const carousel = document.getElementById('carousel');

        // 1. Génération des diapositives de texte
        if (data.slides && Array.isArray(data.slides)) {
          data.slides.forEach((slide, index) => {
            const slideLink = document.createElement('a');
            slideLink.className = `carousel-slide ${index === 0 ? 'active' : ''}`;
            slideLink.style.backgroundColor = slide.color || '#333';
            slideLink.textContent = slide.text || '';
            
            // Récupération de l'URL (prend en charge 'link' ou 'text_link')
            const targetUrl = formatUrl(slide.link || slide.text_link);
            
            if (targetUrl) {
              slideLink.href = targetUrl;
              slideLink.target = "_top";
              slideLink.classList.add('is-clickable');

              // Forçage de la redirection au clic (contourne le blocage d'iframe)
              slideLink.addEventListener('click', (e) => {
                e.preventDefault();
                try {
                  window.top.location.href = targetUrl;
                } catch (err) {
                  window.open(targetUrl, '_blank');
                }
              });
            }

            carousel.appendChild(slideLink);
          });

          slidesElements = document.querySelectorAll('.carousel-slide');
        }

        // 2. Configuration du bouton GIF et de son lien
        const gifLink = document.getElementById('gif-button-link');
        const gifImg = document.getElementById('gif-button-img');

        if (data.gif_button) {
          gifImg.src = data.gif_button;
          gifLink.style.display = 'inline-block';
        }

        const buttonUrl = formatUrl(data.button_link);
        if (buttonUrl) {
          gifLink.href = buttonUrl;
          gifLink.addEventListener('click', (e) => {
            e.preventDefault();
            try {
              window.top.location.href = buttonUrl;
            } catch (err) {
              window.open(buttonUrl, '_blank');
            }
          });
        }
      })
      .catch(error => {
        console.error('Erreur de chargement de la configuration :', error);
      });

    // 3. Défilement automatique du carrousel toutes les 4 secondes
    setInterval(() => {
      if (slidesElements.length === 0) return;
      slidesElements[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % slidesElements.length;
      slidesElements[currentIndex].classList.add('active');
    }, 4000);
  </script>

</body>
</html>
