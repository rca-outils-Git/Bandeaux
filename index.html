<!DOCTYPE html>
  <html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >
    <title>Bandeau Carrousel avec Texte, GIF optionnel et Bouton</title>
    <link rel="stylesheet" href="style2.css">
  </head> 
  <body>
    <!-- Barre de progression -->
    <div class="absolute top-0 left-0 right-0 h-1 bg-slate-800/50">
      <div id="progress" class="progress-bar h-full bg-gradient-to-r from-indigo-500 to-violet-500 w-0"></div>
    </div>

    <!-- Indicateur "En pause" lors du survol -->
    <div id="pause-badge" class="absolute top-4 right-4 text-xs font-medium text-slate-400 bg-slate-800/60 px-2.5 py-1 rounded-full opacity-0 transition-opacity duration-300 flex items-center gap-1.5 border border-slate-700/50">
      <i data-lucide="pause" class="w-3 h-3 text-indigo-400"></i> Pause au survol
    </div>
   
    <!-- Zone de contenu des textes (Diapositives) -->
    <div class="min-h-[220px] sm:min-h-[200px] flex items-center justify-center text-center px-2 my-4">
                
      <!-- Diapositive 1 -->
      <div class="carousel-slide active" data-index="0">
        <div class="p-3 bg-indigo-500/10 rounded-2xl mb-4 text-indigo-400">
          <i data-lucide="sparkles" class="w-6 h-6"></i>
        </div>
        <blockquote class="text-lg sm:text-xl md:text-2xl font-medium text-slate-200 leading-relaxed max-w-xl">
          « La simplicité est la sophistication ultime. Elle permet de concentrer l'attention sur l'essentiel et de créer une expérience mémorable. »
        </blockquote>
        <p class="mt-4 text-sm font-semibold text-indigo-400">
            — Leonardo da Vinci
        </p>
      </div>

    </div>
     
      <!-- Navigation et Puces -->
      <div class="flex items-center justify-between pt-6 border-t border-slate-800/80 mt-2">
        
        <!-- Bouton Précédent -->
        <button id="prev-btn" aria-label="Diapositive précédente" class="p-2.5 rounded-xl bg-slate-800/50 hover:bg-slate-700/60 text-slate-300 hover:text-white transition-all duration-200 border border-slate-700/50 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 active:scale-95">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>

        <!-- Indicateurs / Points (Dots) -->
        <div class="flex items-center space-x-2.5" id="dots-container">
            <button class="dot w-8 h-2 rounded-full bg-indigo-500 transition-all duration-300" aria-label="Aller au texte 1" data-index="0"></button>
            <button class="dot w-2 h-2 rounded-full bg-slate-700 hover:bg-slate-500 transition-all duration-300" aria-label="Aller au texte 2" data-index="1"></button>
            <button class="dot w-2 h-2 rounded-full bg-slate-700 hover:bg-slate-500 transition-all duration-300" aria-label="Aller au texte 3" data-index="2"></button>
        </div>

        <!-- Bouton Suivant -->
        <button id="next-btn" aria-label="Diapositive suivante" class="p-2.5 rounded-xl bg-slate-800/50 hover:bg-slate-700/60 text-slate-300 hover:text-white transition-all duration-200 border border-slate-700/50 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 active:scale-95">
            <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>

      </div>

    </div>
  </main>  
  </body>

</html>
