<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bandeau Carrousel Dynamique</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
    }

    /* Structure principale (~2 cm de hauteur) */
    .banner-container {
      display: flex;
      align-items: center;
      height: 76px;
      width: 100%;
      background-color: #ffffff;
      box-sizing: border-box;
      padding: 8px 16px;
      gap: 16px;
    }

    /* Carrousel */
    .carousel-wrapper {
      flex: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
    }

    .carousel-slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      color: #ffffff;
      font-weight: bold;
      font-size: 15px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    .carousel-slide.active {
      opacity: 1;
    }

    /* Bouton */
    .btn-action {
      height: 100%;
      padding: 0 20px;
      background-color: #1f2937;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s ease;
    }

    .btn-action:hover {
      background-color: #374151;
    }

    

 /* ==========================================================================
        BOUTON D'ACTION avec gif
   ========================================================================== */
  .btn-gif {
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    outline: none;
    border-radius: 8px;
    overflow: hidden; /* Empêche l'image de dépasser des bords arrondis */
    display: inline-block;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  /* Redimensionnement de l'image GIF */
  .btn-gif img {
    display: block;
    width: 150px;  /* Ajuste la largeur souhaitée */
    height: auto;  /* Conserve le ratio d'aspect du GIF */
  }

  /* Effet visuel au survol et au clic */
  .btn-gif:hover {
    transform: scale(1.05); /* Effet d'agrandissement léger */
  }

  .btn-gif:active {
    transform: scale(0.95); /* Effet d'enfoncement au clic */
  }

  </style>
</head>
<body>

  <div class="banner-container">
    <div class="carousel-wrapper" id="carousel">
      <!-- Les diapositives seront générées automatiquement ici -->
    </div>
   
    <button type="button" class="btn-gif" onclick="window.location.href='https://www.randocotedamour.fr/page/3983060-benevolat-rca';">
      <!-- Le GIF est inséré dans l'image -->
      <img src="Votre texte de paragraphe (3).gif" alt="Description de l'action du bouton" />
    </button>
  </div>

  <script>
    let currentIndex = 0;
    let slidesElements = [];

    // Chargement dynamique de la configuration JSON
    fetch('config.json')
      .then(response => response.json())
      .then(data => {
        const carousel = document.getElementById('carousel');
        
        // Génération des éléments HTML à partir du JSON
        data.slides.forEach((slide, index) => {
          const div = document.createElement('div');
          div.className = `carousel-slide ${index === 0 ? 'active' : ''}`;
          div.style.backgroundColor = slide.color;
          div.textContent = slide.text;
          carousel.appendChild(div);
        });

        slidesElements = document.querySelectorAll('.carousel-slide');

        // Lancement de la rotation toutes les 4 secondes
        setInterval(() => {
          if (slidesElements.length === 0) return;
          slidesElements[currentIndex].classList.remove('active');
          currentIndex = (currentIndex + 1) % slidesElements.length;
          slidesElements[currentIndex].classList.add('active');
        }, 4000);
      })
      .catch(error => console.error('Erreur lors du chargement de config.json:', error));
  </script>

</body>
</html>
