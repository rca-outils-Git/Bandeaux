<!DOCTYPE html>
  <html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrousel animé</title>
    <link rel="stylesheet" href="style3.css">
    <script src="script3.js"></script>
    </head> 
  </head>
  <body>
    <div class="carousel" id="carousel">  
        <!-- Annonce 1 -->
        <section class="slide active" style="background-color: #6c5ce7;">
          <img src="1.gif" alt="Illustration slide">
          <p>randomania</p>
        </section>
          
        <!-- Annonce 2 -->
        <section class="slide" style="background-color: deeppink;">
          <img src="nouveau.gif" alt="Illustration slide">
          <p><a href="https://www.randocotedamour.fr/page/3983060-benevolat-rca" target="_blank" class="mon-lien hover:underline text-white">missions en cours rejoignez nos bénévoles</a></p>
        </section>
          
        <!-- Annonce 3 -->
        <section class="slide" style="background-color: rgb(9, 132, 227);">
          
          <p><a href="https://www.randocotedamour.fr/collect/choice/561323-q-randomania-2026" target="_blank" class="mon-lien hover:underline text-white">Troisième texte </a></p>
        </section>
        
     <!-- Navigation et Puces -->
    <div class="carousel-nav">
      
      <!-- Bouton Précédent -->
      <button id="prevBtn" aria-label="Diapositive précédente" class="btn-nav" disabled>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
   <!-- Indicateurs / Points (Dots) -->
      <div class="dots-container" id="dots-container"> 
      <button class="dot active" aria-label="Aller à la slide 1" data-index="0"></button> 
      <button class="dot" aria-label="Aller à la slide 2" data-index="1"></button> 
      <button class="dot" aria-label="Aller à la slide 3" data-index="2"></button></div>
      <!-- Bouton Suivant -->
      <button id="nextBtn" aria-label="Diapositive suivante" class="btn-nav">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div> 
  </div>
   <script>
    const slides = document.querySelectorAll(".slide");
    const dots = document.querySelectorAll(".dot");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const carouselContainer = document.getElementById("carousel");


    let currentSlide = 0;
    const totalSlides = slides.length;
    let autoPlayInterval;
    const slideDuration = 4000; // Durée d'affichage de chaque slide en millisecondes (4 secondes)

    function goToSlide(index) {
      // Boucle infinie (revient au début si on dépasse la fin, ou va à la fin si on recule depuis le début)
      currentSlide = (index + totalSlides) % totalSlides;

      // Met à jour l'affichage des slides
      slides.forEach((slide, i) => {
        slide.classList.toggle("active", i === currentSlide);
      });

      // Met à jour l'état des puces (dots)
      dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === currentSlide);
      });
    }
    
    // Fonctions de navigation
    function nextSlide() {
      goToSlide(currentSlide + 1);
    }

    function prevSlide() {
      goToSlide(currentSlide - 1);
    }

    // Démarrage du défilement automatique
    function startAutoPlay() {
      autoPlayInterval = setInterval(nextSlide, slideDuration);
    }

    // Arrêt du défilement automatique (lors du survol)
    function stopAutoPlay() {
      clearInterval(autoPlayInterval);
    }

    // Événements sur les boutons Précédent / Suivant
    prevBtn.addEventListener("click", () => {
      prevSlide();
      resetAutoPlay();
    });

    nextBtn.addEventListener("click", () => {
      nextSlide();
      resetAutoPlay();
    });

    // Événement clic sur les puces (dots)
    dots.forEach((dot) => {
      dot.addEventListener("click", (e) => {
        const index = parseInt(e.target.getAttribute("data-index"), 10);
        goToSlide(index);
        resetAutoPlay();
      });
    });

    // Remet à zéro le minuteur automatique lorsqu'un utilisateur clique manuellement
    function resetAutoPlay() {
      stopAutoPlay();
      startAutoPlay();
    }

    // Pause au survol de la souris
    carouselContainer.addEventListener("mouseenter", stopAutoPlay);
    carouselContainer.addEventListener("mouseleave", startAutoPlay);

    // Navigation au clavier avec les flèches directionnelles
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") {
        goToSlide(currentSlide + 1);
      } else if (event.key === "ArrowLeft") {
        goToSlide(currentSlide - 1);
      }
    });
  </script>
    
    </body>
  </html>
