<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bandeau Carrousel & Bouton d'Action</title>
  <style>
    :root {
      --primary-color: #3b82f6;
      --primary-hover: #1d4ed8;
      --bg-gradient-start: #0f172a;
      --bg-gradient-end: #1e293b;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius-lg: 16px;
      --radius-md: 12px;
      --transition-fast: 0.25s ease;
      --transition-smooth: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .banner-container {
      width: 100%;
      max-width: 1100px;
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      align-items: center;
    }

    .carousel-section {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 380px;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .carousel-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform var(--transition-smooth);
    }

    .carousel-slide {
      min-width: 100%;
      height: 100%;
      position: relative;
      user-select: none;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .slide-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 16px 12px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 500;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background var(--transition-fast), transform var(--transition-fast);
      z-index: 2;
    }

    .carousel-btn:hover {
      background: rgba(59, 130, 246, 0.8);
      transform: translateY(-50%) scale(1.08);
    }

    .carousel-btn.prev { left: 12px; }
    .carousel-btn.next { right: 12px; }

    .carousel-dots {
      position: absolute;
      bottom: 12px;
      right: 16px;
      display: flex;
      gap: 6px;
      z-index: 2;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .dot.active {
      background: var(--primary-color);
      width: 20px;
      border-radius: 4px;
    }

    .cta-section {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 12px;
      gap: 16px;
    }

    .cta-title {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text-main);
    }

    .cta-description {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, var(--primary-color), #2563eb);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
      transition: all var(--transition-fast);
      gap: 8px;
    }

    .cta-button:hover {
      background: linear-gradient(135deg, #2563eb, var(--primary-hover));
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
    }

    .cta-button:active {
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      .banner-container {
        grid-template-columns: 1fr;
        padding: 16px;
        gap: 16px;
      }

      .cta-section {
        text-align: center;
        padding: 8px 0 0 0;
      }

      .cta-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="banner-container">
    
    <!-- Carrousel d'Images -->
    <div class="carousel-section" id="carousel">
      <div class="carousel-track" id="carouselTrack">
        
        <!-- Slide 1 -->
        <div class="carousel-slide">
          <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80" alt="Plage Tropicale" onerror="this.src='https://placehold.co/800x450/1e293b/f8fafc?text=Image+1'">
          <div class="slide-caption">Découvrez nos destinations exclusives de l'été</div>
        </div>

        <!-- Slide 2 -->
        <div class="carousel-slide">
          <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80" alt="Montagnes" onerror="this.src='https://placehold.co/800x450/1e293b/f8fafc?text=Image+2'">
          <div class="slide-caption">Aventures et escapades en haute montagne</div>
        </div>

        <!-- Slide 3 -->
        <div class="carousel-slide">
          <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1200&q=80" alt="Architecture Urbaine" onerror="this.src='https://placehold.co/800x450/1e293b/f8fafc?text=Image+3'">
          <div class="slide-caption">Explorez les plus belles capitales du monde</div>
        </div>

      </div>

      <!-- Contrôles de Navigation -->
      <button class="carousel-btn prev" id="prevBtn" aria-label="Image précédente">&#10094;</button>
      <button class="carousel-btn next" id="nextBtn" aria-label="Image suivante">&#10095;</button>

      <!-- Indicateurs / Puces -->
      <div class="carousel-dots" id="carouselDots"></div>
    </div>

    <!-- Section Action / Bouton -->
    <div class="cta-section">
      <h2 class="cta-title">Prêt pour votre prochain voyage ?</h2>
      <p class="cta-description">Bénéficiez de 20% de réduction sur toutes vos réservations effectuées avant la fin du mois.</p>
      <a href="#" class="cta-button">
        <span>Réserver maintenant</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </a>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const track = document.getElementById('carouselTrack');
      const slides = Array.from(track.children);
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const dotsContainer = document.getElementById('carouselDots');
      const carouselSection = document.getElementById('carousel');

      let currentIndex = 0;
      let autoplayTimer = null;
      const autoplayDelay = 4000; // 4 secondes par slide

      slides.forEach((_, index) => {
        const dot = document.createElement('div');
        dot.classList.add('dot');
        if (index === 0) dot.classList.add('active');
        dot.addEventListener('click', () => goToSlide(index));
        dotsContainer.appendChild(dot);
      });

      const dots = Array.from(dotsContainer.children);

      function updateCarousel() {
        track.style.transform = `translateX(-${currentIndex * 100}%)`;
        dots.forEach((dot, index) => {
          dot.classList.toggle('active', index === currentIndex);
        });
      }

      function goToSlide(index) {
        currentIndex = index;
        updateCarousel();
        resetAutoplay();
      }

      function nextSlide() {
        currentIndex = (currentIndex + 1) % slides.length;
        updateCarousel();
      }

      function prevSlide() {
        currentIndex = (currentIndex - 1 + slides.length) % slides.length;
        updateCarousel();
      }

      nextBtn.addEventListener('click', () => {
        nextSlide();
        resetAutoplay();
      });

      prevBtn.addEventListener('click', () => {
        prevSlide();
        resetAutoplay();
      });

      function startAutoplay() {
        if (!autoplayTimer) {
          autoplayTimer = setInterval(nextSlide, autoplayDelay);
        }
      }

      function stopAutoplay() {
        clearInterval(autoplayTimer);
        autoplayTimer = null;
      }

      function resetAutoplay() {
        stopAutoplay();
        startAutoplay();
      }

      // Pause de l'autoplay au survol
      carouselSection.addEventListener('mouseenter', stopAutoplay);
      carouselSection.addEventListener('mouseleave', startAutoplay);

      let touchStartX = 0;
      let touchEndX = 0;

      carouselSection.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      carouselSection.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }, { passive: true });

      function handleSwipe() {
        const swipeThreshold = 50;
        if (touchStartX - touchEndX > swipeThreshold) {
          nextSlide();
          resetAutoplay();
        } else if (touchEndX - touchStartX > swipeThreshold) {
          prevSlide();
          resetAutoplay();
        }
      }

      // Démarrer la rotation automatique
      startAutoplay();
    });
  </script>
</body>
</html>
