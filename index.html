<!DOCTYPE html>

<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Bandeau Carrousel avec Texte, GIF optionnel et Bouton</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="banner-container">
    <!-- Zone Carrousel -->
    <div
      class="carousel-wrapper" id="carousel"
    ></div>

    <!-- Zone Bouton GIF principal -->
    <a
      id="gif-button-link" 
      href="#"
      class="btn-gif-link"
      target="_top"
      style="display: none;"
    >

      <img
        id="gif-button-img"
        src=""
        alt="Bouton d'action"
      >
    </a>

  </div>


  <script>

    /***************************************************
     * DONNÉES GÉNÉRÉES PAR GOOGLE APPS SCRIPT
     ***************************************************/

    const data = {"slides":[{"text":"randomania","color":"#dc2626","link":"https://sites.google.com/rando-ca.fr/randomania-2026/accueil","gif":""},{"text":"missions en cours rejoignez nos bénévoles","color":"#2563eb","link":"https://www.randocotedamour.fr/page/3983060-benevolat-rca","gif":"nouveau.gif"},{"text":"Troisième texte ","color":"#16a34a","link":"https://www.randocotedamour.fr/collect/choice/561323-q-randomania-2026","gif":""}],"gif_button":"","button_link":"https://www.randocotedamour.fr/page/3983060-benevolat-rca"};
    let currentIndex = 0;

    let slidesElements = [];

    /***************************************************
     * FORMATAGE DES URL
     ***************************************************/

    function formatUrl(url) {

      if (
        !url ||
        typeof url !== 'string'
      ) {
        return '';
      }


      let cleanUrl =
        url.trim();


      if (!cleanUrl) {
        return '';
      }


      if (
        !cleanUrl.startsWith('http://') &&
        !cleanUrl.startsWith('https://')
      ) {

        cleanUrl =
          'https://' + cleanUrl;
      }


      return cleanUrl;
    }


    /***************************************************
     * AFFICHAGE DU CARROUSEL
     ***************************************************/

    function renderCarousel(data) {

      const carousel =
        document.getElementById(
          'carousel'
        );


      carousel.innerHTML = '';


      /*************************************************
       * SLIDES
       *************************************************/

      if (
        data.slides &&
        Array.isArray(data.slides)
      ) {


        data.slides.forEach(
          (slide, index) => {


            const slideLink =
              document.createElement('a');


            slideLink.className =
              'carousel-slide ' +
              (
                index === 0
                  ? 'active'
                  : ''
              );


            slideLink.style.backgroundColor =
              slide.color || '#333';


            /*******************************************
             * GIF
             *******************************************/

            if (
              slide.gif &&
              slide.gif.trim() !== ''
            ) {

              const img =
                document.createElement('img');


              img.src =
                slide.gif.trim();


              img.alt =
                'Illustration';


              img.className =
                'slide-gif';


              slideLink.appendChild(img);
            }


            /*******************************************
             * TEXTE
             *******************************************/

            const spanText =
              document.createElement('span');


            spanText.className =
              'slide-text';


            spanText.textContent =
              slide.text || '';


            slideLink.appendChild(
              spanText
            );


            /*******************************************
             * LIEN
             *******************************************/

            const targetUrl =
              formatUrl(
                slide.link ||
                slide.text_link
              );


            if (targetUrl) {

              slideLink.href =
                targetUrl;


              slideLink.target =
                '_top';


              slideLink.classList.add(
                'is-clickable'
              );


              slideLink.addEventListener(
                'click',
                (e) => {

                  e.preventDefault();


                  try {

                    window.top.location.href =
                      targetUrl;

                  }
                  catch (err) {

                    window.open(
                      targetUrl,
                      '_blank'
                    );

                  }

                }
              );

            }


            carousel.appendChild(
              slideLink
            );

          }
        );


        slidesElements =
          document.querySelectorAll(
            '.carousel-slide'
          );

      }

      /*************************************************
       * BOUTON GIF PRINCIPAL
       *************************************************/

      const gifLink =
        document.getElementById(
          'gif-button-link'
        );


      const gifImg =
        document.getElementById(
          'gif-button-img'
        );


      if (data.gif_button) {
        gifImg.src = data.gif_button;
        gifLink.style.display = 'inline-block';
      }

      /*************************************************
       * LIEN DU BOUTON
       *************************************************/
      const buttonUrl = formatUrl(data.button_link);
      if (buttonUrl) {
        gifLink.href = buttonUrl;
        gifLink.addEventListener(
          'click',
          (e) => {
            e.preventDefault();
            try {

              window.top.location.href =
                buttonUrl;

            }
            catch (err) {

              window.open(
                buttonUrl,
                '_blank'
              );

            }

          }
        );

      }

    }


    /***************************************************
     * AFFICHAGE INITIAL
     ***************************************************/
    renderCarousel(data);

    /***************************************************
     * DÉFILEMENT AUTOMATIQUE
     ***************************************************/

    setInterval(() => {

      if (
        slidesElements.length === 0
      ) {
        return;
      }


      slidesElements[
        currentIndex
      ].classList.remove(
        'active'
      );


      currentIndex =
        (
          currentIndex + 1
        ) %
        slidesElements.length;


      slidesElements[
        currentIndex
      ].classList.add(
        'active'
      );

    }, 4000);


  </script>


</body>

</html>
