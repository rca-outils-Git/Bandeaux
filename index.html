<!DOCTYPE html>
  <html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrousel animé</title>
    <script src="script3.js"></script>
    </head> 
    <body>
      <div class="carousel" id="carousel"> <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      display: flex;         /* Utilise Flexbox pour la mise en page générale */
      justify-content: center; /* Centre le contenu horizontalement */
      align-items: center;   /* Centre le contenu verticalement */
      padding: 20px;         /* Espace de sécurité autour du contenu sur petits écrans */
      font-family: Arial, sans-serif; /* Police d'écriture principale */
      background: #ffffff;   /* Couleur de fond de la page (gris très clair) */
    }

    body-xx {
      min-height: 100vh;
      display: flex;         /* Utilise Flexbox pour la mise en page générale */
      justify-content: center; /* Centre le contenu horizontalement */
      align-items: center;   /* Centre le contenu verticalement */
      padding: 20px;         /* Espace de sécurité autour du contenu sur petits écrans */
      font-family: Arial, sans-serif; /* Police d'écriture principale */
      background: #f3f4f6;   /* Couleur de fond de la page (gris très clair) */
    }

    /* --------------------------------------------------
       CONTENEUR PRINCIPAL DU CARROUSEL
       -------------------------------------------------- */
    .carousel {
      width: 100%;           /* Occupe toute la largeur disponible */
      max-width: 1100px;      /* Limite la largeur maximale à 900px */
      overflow: hidden;      /* Masque tout contenu qui dépasserait du conteneur */
      border-radius: 24px;   /* Arrondit les angles du carrousel */
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15); /* Ombre portée douce */
      background: #ffffff;
      padding-bottom: 2px;
    }

    /* --------------------------------------------------
       STYLES DES DIAPOSITIVES (Slides)
       -------------------------------------------------- */
    .slide {
      display: none;          /* Masque les diapositives par défaut */
      min-height: 80px;      /* Hauteur minimale de chaque slide */
      padding: 2px;          /* Espacement interne */
      color: white;           /* Couleur du texte en blanc */
      text-align: center;     /* Centre le texte */
      flex-direction: row;    /* Aligne les éléments enfants horizontalement */
      align-items: center;    /* Centre les enfants verticalement */
      justify-content: center;/* Centre les enfants horizontalement */
      gap: 15px;              /* Espace entre chaque élément */
      animation: fadeIn 0.4s ease; /* Animation d'apparition fluide */
    }

    .slide.active {
      display: flex;
    }

    /* Titres dans les slides */
    .slide h2, .slide h3 {
      font-size: clamp(22px, 4vw, 32px);
      line-height: 1.2;
    }

    /* Paragraphes dans les slides */
    .slide p {
      max-width: 480px;       /* Limite la largeur du texte pour la lisibilité */
      font-size: 16px;
      line-height: 1.6;
    }

    /* Images intégrées dans les slides */
    .slide img {
      width: 100%;
      max-width: 100px;       /* Largeur maximale de l'image */
      height: 50px;           /* Hauteur fixe de l'image */
      object-fit: cover;      /* Conserve le ratio de l'image sans la déformer */
      border-radius: 12px;    /* Arrondit les coins de l'image */
      background: rgba(255,255,255,0.15);
      flex-shrink: 0;
    }

    /* Style par défaut (text-white) */
    .mon-lien {
      color: #ffffff;
      text-decoration: none; /* Pas de soulignement au départ */
    }

    /* Style au survol (hover:underline) */
    .mon-lien:hover {
      text-decoration: underline;
    }


    /* --------------------------------------------------
       NAVIGATION ET BOUTONS
       -------------------------------------------------- */
    .carousel-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 2px;
      margin-top: 4px;
      padding-left: 24px; 
      padding-right: 24px;
    }

    /* Boutons de navigation (Précédent / Suivant) */
    .btn-nav {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      border-radius: 8px;
      background-color: rgba(30, 41, 59, 0.8); /* slate-800 */
      color: #cbd5e1; /* slate-300 */
      border: 1px solid rgba(51, 65, 85, 0.5); /* slate-700/50 */
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-nav:hover:not(:disabled) {
      background-color: rgba(51, 65, 85, 1);
      color: #ffffff;
    }

    .btn-nav:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-nav:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.5);
    }

    .btn-nav:active:not(:disabled) {
      transform: scale(0.95);
    }

    /* Taille des icônes SVG */
    .btn-nav .icon {
      width: 16px;
      height: 12px;
    }

    /* Conteneur des puces (Dots) */
    .dots-container {
      display: flex;
      align-items: center;
      gap: 10px;                /* espacement des puces 
    }

    /* Puces de navigation */
    .dot {
      width: 8px;
      height: 8px;
      border: none;
      border-radius: 9999px;
      background-color: #cbd5e1; /* slate-300 */
      cursor: pointer;
      transition: all 0.3s ease;
      padding: 0;
    }

    .dot:hover {
      background-color: #64748b; /* slate-500 */
    }

    /* Puce active */
    .dot.active {
      width: 32px;
      background-color: #6366f1; /* indigo-500 */
    }

    /* --------------------------------------------------
       ANIMATIONS & RESPONSIVE
       -------------------------------------------------- */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .slide {
        flex-direction: column;
        min-height: 220px;
        padding: 12px 8px;
      }

      .slide img {
        height: 80px;
        max-width: 120px;
      }
    }
  </style>
  <
     <!-- Navigation et Puces -->
    <div class="carousel-nav">
      
      <!-- Bouton Précédent -->
      <button id="prevBtn" aria-label="Diapositive précédente" class="btn-nav" disabled>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
   !
      <!-- Bouton Suivant -->
      <button id="nextBtn" aria-label="Diapositive suivante" class="btn-nav">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div> 
  </div>
   <script>
    const slides = document.querySelectorAll(".slide");
    const dots = document.querySelectorAll(".dot");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let currentSlide = 0;
    const totalSlides = slides.length;

    function goToSlide(index) {
      // Borne le numéro de slide
      currentSlide = Math.max(0, Math.min(index, totalSlides - 1));

      // Met à jour l'affichage des slides
      slides.forEach((slide, i) => {
        slide.classList.toggle("active", i === currentSlide);
      });

      // Met à jour l'état des puces (dots)
      dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === currentSlide);
      });

      // Met à jour les boutons (désactivation aux extrémités)
      prevBtn.disabled = (currentSlide === 0);
      nextBtn.disabled = (currentSlide === totalSlides - 1);
    }

    // Événements sur les boutons Précédent / Suivant
    prevBtn.addEventListener("click", () => goToSlide(currentSlide - 1));
    nextBtn.addEventListener("click", () => goToSlide(currentSlide + 1));

    // Événement clic sur les puces (dots)
    dots.forEach((dot) => {
      dot.addEventListener("click", (e) => {
        const index = parseInt(e.target.getAttribute("data-index"), 10);
        goToSlide(index);
      });
    });

    // Navigation au clavier avec les flèches directionnelles
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") {
        goToSlide(currentSlide + 1);
      } else if (event.key === "ArrowLeft") {
        goToSlide(currentSlide - 1);
      }
    });
  </script>
    
    </body>
  </html>
