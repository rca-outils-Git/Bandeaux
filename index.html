<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bandeau Carrousel avec Bouton GIF et Textes Cliquables</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
    }

    /* Structure du bandeau (~2 cm de hauteur = 76px) */
    .banner-container {
      display: flex;
      align-items: center;
      height: 76px;
      width: 100%;
      background-color: #ffffff;
      box-sizing: border-box;
      padding: 8px 16px;
      gap: 16px;
    }

    /* Conteneur du carrousel de textes */
    .carousel-wrapper {
      flex: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
    }

    /* Diapositives (balises <a> pour rendre le texte cliquable) */
    .carousel-slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      color: #ffffff;
      font-weight: bold;
      font-size: 15px;
      text-align: center;
      text-decoration: none; /* Supprime le soulignement du lien */
      opacity: 0;
      transition: opacity 0.5s ease-in-out, transform 0.2s ease;
      cursor: default;
    }

    /* Rendre le curseur cliquable seulement si la slide a un lien */
    .carousel-slide[href] {
      cursor: pointer;
    }

    .carousel-slide[href]:hover {
      opacity: 0.95; /* Effet léger au survol */
    }

    .carousel-slide.active {
      opacity: 1;
    }

    /* Conteneur et style du bouton GIF */
    .btn-gif-link {
      display: inline-block;
      height: 100%;
      cursor: pointer;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .btn-gif-link:hover {
      transform: scale(1.04);
    }

    .btn-gif-link img {
      display: block;
      height: 100%;
      width: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <p> Avec lien 2</p>
  <div class="banner-container">
    <!-- Zone Carrousel -->
    <div class="carousel-wrapper" id="carousel">
      <!-- Les diapositives seront injectées par le script -->
    </div>

    <!-- Zone Bouton GIF (remplie dynamiquement via l'API) -->
    <a id="gif-button-link" href="#" class="btn-gif-link" target="_top" style="display: none;">
      <img id="gif-button-img" src="" alt="Bouton d'action">
    </a>

    <p> Avec lien 2</p>
  </div>

  <script>
   let currentIndex = 0;
    let slidesElements = [];

    // Chargement dynamique depuis Google Apps Script
    fetch("https://script.google.com/macros/s/AKfycbxmbY5WIgEJ9JJ-woQgfR5oF7j79eCSys_Wl-cxDmpaHt-ay1HPtPRnQRK0-aXbqHzK/exec")
      .then(response => {
        if (!response.ok) {
          throw new Error('Impossible de récupérer la configuration');
        }
        return response.json();
      })
      .then(data => {
        // 1. Génération des diapositives de texte
        const carousel = document.getElementById('carousel');

        if (data.slides && Array.isArray(data.slides)) {
          data.slides.forEach((slide, index) => {
            const slideLink = document.createElement('a');
            slideLink.className = `carousel-slide ${index === 0 ? 'active' : ''}`;
            slideLink.style.backgroundColor = slide.color || '#333';
            slideLink.textContent = slide.text || '';
            
            // Vérification et nettoyage de l'URL du lien
            let targetUrl = slide.link || slide.text_link || '';
            if (targetUrl && targetUrl.trim() !== "") {
              // Ajoute https:// si l'utilisateur l'a oublié dans Google Sheets
              if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                targetUrl = 'https://' + targetUrl.trim();
              }
              
              slideLink.href = targetUrl;
              slideLink.target = "_top"; // Redirige toute la fenêtre principale
              
              // Sécurité complémentaire pour déclencher l'ouverture si le clic est capturé par un parent
              slideLink.addEventListener('click', (e) => {
                if (targetUrl) {
                  window.top.location.href = targetUrl;
                }
              });
            } else {
              slideLink.removeAttribute('href'); // Supprime la main/pointer si pas de lien
            }

            carousel.appendChild(slideLink);
          });

          slidesElements = document.querySelectorAll('.carousel-slide');
        }

        // 2. Configuration du bouton GIF et de son lien
        const gifLink = document.getElementById('gif-button-link');
        const gifImg = document.getElementById('gif-button-img');

        if (data.gif_button) {
          gifImg.src = data.gif_button;
          gifLink.style.display = 'inline-block';
        }

        if (data.button_link) {
          let btnUrl = data.button_link.trim();
          if (!btnUrl.startsWith('http://') && !btnUrl.startsWith('https://')) {
            btnUrl = 'https://' + btnUrl;
          }
          gifLink.href = btnUrl;
        }
      })
      .catch(error => {
        console.error('Erreur de chargement de la configuration :', error);
      });

    // 3. Défilement automatique du carrousel toutes les 4 secondes
    setInterval(() => {
      if (slidesElements.length === 0) return;
      slidesElements[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % slidesElements.length;
      slidesElements[currentIndex].classList.add('active');
    }, 4000);
    
  </script>

</body>
</html>
